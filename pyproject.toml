[project]
name = "ancisite"
version = "0.1.0"
description = "Plug-and-play 'good enough' web app hosting on one box"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
]

[project.scripts]
anci = "anci.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["anci"]
