# Builds the release binaries and publishes them as a GitHub release.
# Runs when a `vX.Y.Z` tag is pushed. `make release` builds all four
# platforms from this one Linux runner, so no build matrix is needed.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # lets the job create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      # The version in the repo is a placeholder: the tag is the real version.
      # Write it into the source here (never committed) so the binary's
      # `anci --version` reports it.
      - name: Set the version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"$v\"/" anci/__init__.py
          sed -i "s/^version = .*/version = \"$v\"/" pyproject.toml
          grep -qx "__version__ = \"$v\"" anci/__init__.py || { echo "couldn't set __version__"; exit 1; }
          grep -qx "version = \"$v\"" pyproject.toml || { echo "couldn't set version in pyproject.toml"; exit 1; }

      - run: make release

      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
